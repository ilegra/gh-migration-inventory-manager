name: CD Release Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump level'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  filter:
    name: Check Code Changes
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Filter Changed Paths
        uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            code:
              - 'src/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'poetry.lock'
              - 'poetry.toml'
              - 'Dockerfile'
              - 'action.yml'

  release:
    name: Build Wheel, Tag & Publish GitHub Release
    needs: [filter]
    if: >-
      (needs.filter.outputs.code == 'true' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Generate App Token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.SYNC_BOT_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -

      - name: Configure Poetry Path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --with dev

      - name: Configure Git Identity for GitHub App
        run: |
          git config user.name "gh-sync-bot[bot]"
          git config user.email "${{ vars.GH_APP_ID }}+gh-sync-bot[bot]@users.noreply.github.com"

      - name: Bump Version in pyproject.toml and Commit
        id: bump
        run: |
          BUMP_TYPE="${{ inputs.bump_type }}"
          if [ -z "$BUMP_TYPE" ]; then
            BUMP_TYPE="patch"
          fi
          echo "Bumping version using type: $BUMP_TYPE"

          poetry version "$BUMP_TYPE"
          NEW_VERSION=$(poetry version --short)
          TAG_NAME="v${NEW_VERSION}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"

          git add pyproject.toml
          git commit -m "chore(release): bump version to ${NEW_VERSION} [skip ci]"
          git push origin HEAD:main

      - name: Build Library Package (Wheel & Sdist)
        run: |
          poetry build
          echo "Built distribution artifacts:"
          ls -la dist/

      - name: Generate Release Notes
        run: |
          poetry run python -m src.release_notes --output RELEASE_NOTES.md
          echo "Generated release notes:"
          cat RELEASE_NOTES.md

      - name: Create Git Tag and GitHub Release with Artifacts
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          TAG_NAME="${{ steps.bump.outputs.tag }}"
          gh release create "$TAG_NAME" \
            dist/* \
            --title "Release ${TAG_NAME}" \
            --notes-file RELEASE_NOTES.md \
            --target main

      - name: Update Floating Major Version Tag
        run: |
          MAJOR_TAG="v$(echo "${{ steps.bump.outputs.version }}" | cut -d. -f1)"
          git tag -fa "$MAJOR_TAG" -m "Update floating major tag $MAJOR_TAG to ${{ steps.bump.outputs.tag }}"
          git push origin "$MAJOR_TAG" --force

      - name: Upload Build Artifacts to Actions Run
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/*
          retention-days: 90
